name: 🎭 Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: 🔑 Create .env file
        run: |
          echo "BASE_URL=https://opensource-demo.orangehrmlive.com" >> .env
          echo "ADMIN_USERNAME=Admin" >> .env
          echo "ADMIN_PASSWORD=admin123" >> .env

      - name: 🧪 Run Playwright Tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true

      - name: 📊 Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: 📋 Upload JUnit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ matrix.browser }}
          path: test-results/results.xml
          retention-days: 30

      - name: 🎬 Upload Failures
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Publish HTML Report dari Chromium ke GitHub Pages
  report:
    name: 📊 Publish Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: 📥 Download Chromium Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report
        continue-on-error: true

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-report
          force_orphan: true
